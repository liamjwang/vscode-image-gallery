name: Publish to Marketplace

on:
  push:
    branches:
    - production

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v4
    - name: Install Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
    - name: Install extension
      run: npm install
    - name: Deploy with PAT
      run: npm run deploy
      env:
        VSCE_PAT: ${{ secrets.VSCE_PAT }}
